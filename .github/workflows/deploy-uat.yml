name: Deploy to UAT

on:
  push:
    branches:
      - uat

permissions:
  contents: read

concurrency:
  group: salesforce-uat-metadata
  queue: max
  cancel-in-progress: false

jobs:
  deployment:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    environment: UAT
    env:
      API_VERSION: "67.0"
      SF_CLI_VERSION: "2.150.6"
      SGD_VERSION: "6.45.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install SF CLI
        run: |
          npm install --global "@salesforce/cli@${SF_CLI_VERSION}"
          sf version

      - name: Install sfdx-git-delta plugin
        run: echo y | sf plugins install "sfdx-git-delta@${SGD_VERSION}"

      - name: Authenticate to Salesforce (UAT)
        run: |
          echo "${{ secrets.AUTH_URL_UAT }}" > auth_url.txt
          sf auth sfdxurl store --sfdx-url-file auth_url.txt --set-default
          rm auth_url.txt

      - name: Generate delta
        run: |
          mkdir -p .delta
          sf sgd source delta \
            --api-version "${API_VERSION}" \
            --to "${{ github.event.after }}" \
            --from "${{ github.event.before }}" \
            --source-dir force-app \
            --output-dir .delta \
            --changes-manifest

      - name: Show package.xml
        run: cat .delta/package/package.xml || true

      - name: Show destructiveChanges.xml
        run: cat .delta/destructiveChanges/destructiveChanges.xml || true

      - name: Select Apex tests
        id: test-selection
        run: node .github/scripts/select-deployment-tests.js

      - name: Deploy to UAT
        env:
          SELECTED_TEST_LEVEL: ${{ steps.test-selection.outputs.test_level }}
          SELECTED_TESTS: ${{ steps.test-selection.outputs.tests }}
        run: |
          if grep -q "<types>" .delta/package/package.xml .delta/destructiveChanges/destructiveChanges.xml 2>/dev/null; then
            echo "Delta detected – deploying to UAT"
            test_args=(--test-level "${SELECTED_TEST_LEVEL}")
            if [[ "${SELECTED_TEST_LEVEL}" == "RunSpecifiedTests" ]]; then
              read -r -a test_names <<< "${SELECTED_TESTS}"
              for test_name in "${test_names[@]}"; do
                test_args+=(--tests "${test_name}")
              done
            fi
            sf project deploy start \
              --manifest .delta/package/package.xml \
              --post-destructive-changes .delta/destructiveChanges/destructiveChanges.xml \
              "${test_args[@]}" \
              --api-version "${API_VERSION}" \
              --wait 300 \
              --verbose \
              --ignore-warnings \
              --ignore-conflicts
          else
            echo "No metadata changes detected – skipping deploy"
          fi
